# Railway deployment config. Kept in the repo so the deploy is reproducible
# rather than configured by hand in the dashboard.

[build]
# Explicit: the repo has both a Cargo project and a Node client, and provider
# detection picks the wrong one.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# /health is bearer-protected by design, so a platform probe pointed at it
# would 401 and fail every deploy. /healthz is the unauthenticated probe.
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
